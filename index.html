<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Jualan Tilapia Merah</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#ffb3b3,transparent 35%),
    linear-gradient(135deg,#7a0015,#ffeded);
  min-height:100vh;
  padding:30px 18px 18px; /* tambah ruang atas */
}

.container{
  max-width:460px;
  margin:auto;
}

.header{
  text-align:center;
  color:white;
  margin-bottom:22px;
  padding-top:10px; /* bagi turun lagi sikit */
}

h1{
  margin:0;
  font-family:'Playfair Display', serif;
  font-size:32px;
  font-weight:700;
  background:linear-gradient(90deg,#ffffff,#ffd6d6);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 3px 12px rgba(0,0,0,0.25);
  letter-spacing:0.5px;
}

.subtitle{
  font-size:14px;
  opacity:.9;
  margin-top:8px;
}

.card{
  background:rgba(255,255,255,0.96);
  border-radius:28px;
  padding:22px;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

.section-title{
  font-weight:700;
  color:#9b001b;
  margin:8px 0 12px;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin-bottom:13px;
}

label{
  font-size:13px;
  font-weight:600;
  color:#333;
}

input{
  width:100%;
  padding:14px;
  margin-top:6px;
  border-radius:16px;
  border:1.5px solid #ffd0d0;
  font-size:16px;
  outline:none;
  background:#fffafa;
}

input:focus{
  border-color:#b00020;
  box-shadow:0 0 0 4px rgba(176,0,32,.10);
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:18px;
  margin-top:12px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.kira{
  background:linear-gradient(135deg,#b00020,#ff355d);
  color:white;
  box-shadow:0 8px 18px rgba(176,0,32,.35);
}

.copy{
  background:#25D366;
  color:white;
  box-shadow:0 8px 18px rgba(37,211,102,.35);
}

.result{
  background:linear-gradient(135deg,#fff1f1,#ffe0e0);
  border:1px solid #ffc6c6;
  border-radius:20px;
  padding:16px;
  margin-top:18px;
  font-size:15px;
  line-height:1.8;
}

.total{
  margin-top:10px;
  padding:13px;
  border-radius:16px;
  background:#9b001b;
  color:white;
  font-size:20px;
  font-weight:800;
  text-align:center;
}

textarea{
  width:100%;
  height:175px;
  margin-top:14px;
  border-radius:18px;
  padding:14px;
  font-size:14px;
  border:1.5px solid #ffd0d0;
  outline:none;
  background:#fffafa;
}

.footer{
  text-align:center;
  color:#666;
  font-size:12px;
  margin-top:16px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Kalkulator Jualan Tilapia Merah</h1>
    <div class="subtitle">Kira harga ikan, caj rider dan jumlah bayaran customer</div>
  </div>

  <div class="card">

    <div class="section-title">Maklumat Jualan</div>

    <div class="grid">
      <div class="field">
        <label>Berat Ikan (KG)</label>
        <input type="number" id="kg" placeholder="10">
      </div>

      <div class="field">
        <label>Harga / KG (RM)</label>
        <input type="number" id="hargaKg" placeholder="15">
      </div>
    </div>

    <div class="section-title">Maklumat Rider</div>

    <div class="grid">
      <div class="field">
        <label>Jarak (KM)</label>
        <input type="number" id="km" placeholder="8">
      </div>

      <div class="field">
        <label>Caj / KM (RM)</label>
        <input type="number" id="hargaKm" placeholder="1.50">
      </div>
    </div>

    <button class="kira" onclick="kira()">Kira Jumlah Bayaran</button>

    <div class="result" id="result">
      Masukkan maklumat jualan untuk lihat jumlah bayaran.
    </div>

    <textarea id="ayat" readonly placeholder="Ayat WhatsApp untuk customer akan keluar di sini..."></textarea>

    <button class="copy" onclick="copyWhatsApp()">Copy Ayat WhatsApp</button>

    <div class="footer">Powered by Backyard 360</div>

  </div>
</div>

<script>
function formatRM(num){
  return "RM" + Number(num).toFixed(2);
}

function kira(){
  let kg = parseFloat(document.getElementById("kg").value) || 0;
  let hargaKg = parseFloat(document.getElementById("hargaKg").value) || 0;
  let km = parseFloat(document.getElementById("km").value) || 0;
  let hargaKm = parseFloat(document.getElementById("hargaKm").value) || 0;

  let jumlahIkan = kg * hargaKg;
  let cajRider = km * hargaKm;
  let jumlahBayar = jumlahIkan + cajRider;

  document.getElementById("result").innerHTML = `
    <b>Berat ikan:</b> ${kg} KG<br>
    <b>Harga ikan:</b> ${formatRM(jumlahIkan)}<br>
    <b>Caj rider:</b> ${formatRM(cajRider)}
    <div class="total">Jumlah: ${formatRM(jumlahBayar)}</div>
  `;

  let ayat = 
`Assalamualaikum,

Tempahan:

Berat ikan: ${kg} KG
Harga ikan: ${formatRM(hargaKg)} / KG
Jumlah harga ikan: ${formatRM(jumlahIkan)}

Jarak penghantaran: ${km} KM
Caj rider: ${formatRM(cajRider)}

Jumlah keseluruhan:
${formatRM(jumlahBayar)}

Terima kasih.`;

  document.getElementById("ayat").value = ayat;
}

function copyWhatsApp(){
  let ayat = document.getElementById("ayat");
  ayat.select();
  ayat.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Ayat WhatsApp berjaya dicopy!");
}
</script>

</body>
</html>
